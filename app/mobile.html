<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>面试助手 · 手机端</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0f1117; color: #e8eaf0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 10px 14px 8px; background: #14161c; border-bottom: 1px solid #232836;
    display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  header .title { font-size: 15px; font-weight: 600; }
  header .status { margin-left: auto; font-size: 12px; color: #8b93a7; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #5d6577; }
  .dot.ok { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
  .dot.bad { background: #f87171; }
  .bar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; background: #12141a; border-bottom: 1px solid #1f242f; }
  .bar .auto { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #cfd6e6; }
  .bar .auto input { width: 38px; height: 22px; appearance: none; -webkit-appearance: none;
    background: #2a3142; border-radius: 11px; position: relative; outline: none; margin: 0;
    transition: background .15s; flex: 0 0 auto; }
  .bar .auto input:checked { background: #3b6ef6; }
  .bar .auto input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; transition: left .15s; }
  .bar .auto input:checked::after { left: 19px; }
  .bar .spacer { margin-left: auto; }
  .bar .ghost { background: transparent; border: 1px solid #313a4f; color: #9aa3b8;
    font-size: 12px; padding: 5px 10px; border-radius: 8px; }
  main { flex: 1 1 auto; overflow-y: auto; padding: 10px 12px 14px; -webkit-overflow-scrolling: touch; }
  details { background: #151922; border: 1px solid #232836; border-radius: 10px;
    padding: 8px 10px; margin-bottom: 10px; }
  summary { font-size: 12px; color: #9aa3b8; cursor: pointer; outline: none; }
  #transcript { margin: 8px 0 0; white-space: pre-wrap; word-break: break-word;
    font-size: 12px; line-height: 1.55; color: #aeb6c8; max-height: 24vh; overflow-y: auto; }
  .msg { max-width: 94%; margin: 6px 0 12px; padding: 9px 12px; border-radius: 12px;
    white-space: normal; word-break: break-word; font-size: 14px; line-height: 1.62; }
  .msg.ai { margin-left: auto; background: linear-gradient(160deg, #23345c, #1b2740);
    border: 1px solid #2f4470; border-top-right-radius: 4px; }
  .msg.sys { margin-left: auto; margin-right: auto; max-width: 100%; background: #191d27;
    color: #8b93a7; font-size: 12px; text-align: center; border-radius: 8px; }
  .tag { display: block; font-size: 11px; color: #7f8ba6; margin-bottom: 5px; }
  .typing { color: #6ea8ff; }
  .err { color: #f87171; font-size: 12px; margin-top: 4px; }
  .badge { display: flex; align-items: center; gap: 10px; padding: 2px 0 2px; }
  .badge .letter { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 10px;
    background: #3b6ef6; color: #fff; font-size: 24px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; }
  .badge .option { font-size: 15px; font-weight: 600; line-height: 1.4; }
  .code { margin: 6px 0 2px; border: 1px solid #2b3446; border-radius: 9px;
    background: #0b0e14; overflow: hidden; }
  .code .lang { padding: 5px 10px; font-size: 11px; color: #7f8ba6; background: #11151d;
    border-bottom: 1px solid #232b3a; text-transform: lowercase; }
  .code pre { margin: 0; padding: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    font-family: Consolas, "SF Mono", Menlo, "Courier New", monospace;
    font-size: 12.5px; line-height: 1.58; color: #d7e2f7; white-space: pre; }
  code.inline { background: #0b0e14; border: 1px solid #2b3446; border-radius: 4px;
    padding: 1px 4px; font-family: Consolas, "SF Mono", Menlo, monospace; font-size: 12.5px; color: #a8c7ff; }
  footer { flex: 0 0 auto; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    background: #14161c; border-top: 1px solid #232836; display: flex; flex-direction: column; gap: 7px; }
  footer .row { display: flex; gap: 7px; }
  footer button { flex: 1; padding: 11px 8px; border-radius: 10px; border: 1px solid #313a4f;
    background: #232a39; color: #e8eaf0; font-size: 14px; font-weight: 600; }
  footer button.primary { background: #3b6ef6; border-color: #3b6ef6; }
  footer button.submit { background: #244b3a; border-color: #2f6b50; color: #c9f5dc; }
  footer button:disabled { opacity: .45; }
  #toast { position: fixed; left: 50%; bottom: 126px; transform: translateX(-50%);
    background: rgba(20,22,28,.95); border: 1px solid #313a4f; color: #dfe5f2;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0;
    transition: opacity .2s; pointer-events: none; z-index: 9; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <span class="title">面试助手</span>
  <span class="status"><span id="net" class="dot"></span><span id="statusText">连接中…</span></span>
</header>
<div class="bar">
  <label class="auto"><input type="checkbox" id="autoChk"><span>自动回答</span></label>
  <span class="spacer"></span>
  <button id="clearBtn" class="ghost">清空</button>
</div>
<main id="main">
  <details open>
    <summary>实时转写</summary>
    <pre id="transcript">（尚未开始监听）</pre>
  </details>
  <div id="answers"></div>
</main>
<footer>
  <div class="row">
    <button id="listenBtn">开始监听</button>
    <button id="answerBtn">立即回答</button>
    <button id="shotBtn" class="primary">截图答题</button>
  </div>
  <div class="row">
    <button id="addShotBtn" title="截一张并暂存，可连续截多张">＋ 追加截图</button>
    <button id="submitShotsBtn" class="submit" title="把暂存的多张截图一起提交">提交（0）</button>
  </div>
</footer>
<div id="toast"></div>
<script>
  var LF = String.fromCharCode(10);
  var TOKEN = new URLSearchParams(location.search).get('t') || '';
  var lastSig = '';
  var nearBottom = true;
  var toastTimer = null;
  // 刚拨动开关时短暂锁定，避免轮询用旧状态把开关拨回去（700ms 一轮，留两轮余量）
  var autoLockUntil = 0;

  function api(path, options) {
    var sep = path.indexOf('?') >= 0 ? '&' : '?';
    return fetch(path + sep + 't=' + encodeURIComponent(TOKEN), options || {});
  }

  function toast(text) {
    var el = document.getElementById('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1600);
  }

  function post(path, body) {
    return api(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    }).then(function (res) { return res.text(); });
  }

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function rtrim(s) {
    var end = s.length;
    while (end > 0) {
      var ch = s.charAt(end - 1);
      if (ch === ' ' || ch === LF || ch === String.fromCharCode(13) || ch === String.fromCharCode(9)) {
        end--;
      } else {
        break;
      }
    }
    return s.slice(0, end);
  }

  function inlineHtml(text) {
    var t = esc(text);
    t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    t = t.replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
    return t.split(LF).join('<br>');
  }

  function renderBody(text) {
    var parts = String(text).split('```');
    // 流式输出时代码围栏可能还没闭合，补一个空尾巴，让最后一段仍按代码块渲染
    if (parts.length % 2 === 0) parts.push('');
    var html = '';
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        var seg = parts[i];
        var nl = seg.indexOf(LF);
        var lang = '';
        var code = seg;
        if (nl >= 0) {
          lang = seg.slice(0, nl).replace(/^[ ]+|[ ]+$/g, '');
          code = seg.slice(nl + 1);
        }
        html += '<div class="code"><div class="lang">' + esc(lang || 'code') + '</div><pre>'
          + esc(rtrim(code)) + '</pre></div>';
      } else {
        html += inlineHtml(parts[i]);
      }
    }
    return html;
  }

  function badgeOf(text) {
    var t = String(text).trim();
    if (!t || t.length > 60) return null;
    t = t.replace(/^答案[:：]?[ ]*/, '');
    var m = /^([A-Da-d])[.．、)）]?[ ]*(.*)$/.exec(t);
    if (!m || m[2].length > 40) return null;
    return { letter: m[1].toUpperCase(), option: m[2].trim() };
  }

  function render(state) {
    document.getElementById('statusText').textContent = state.status || '待命';
    document.getElementById('listenBtn').textContent = state.listening ? '停止监听' : '开始监听';
    if (Date.now() > autoLockUntil) {
      document.getElementById('autoChk').checked = !!state.auto;
    }

    var shots = state.shots || 0;
    var submitBtn = document.getElementById('submitShotsBtn');
    submitBtn.textContent = '提交（' + shots + '）';
    submitBtn.disabled = shots === 0;

    var transcript = document.getElementById('transcript');
    transcript.textContent = state.transcript || '（尚未开始监听）';

    var answers = state.answers || [];
    var sig = answers.map(function (a) {
      return a.id + ':' + a.text.length + ':' + (a.done ? 1 : 0) + ':' + a.error;
    }).join('|');
    sig += '|' + shots + '|' + (state.auto ? 1 : 0);
    if (sig === lastSig) return;
    lastSig = sig;

    var main = document.getElementById('main');
    nearBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 100;

    var box = document.getElementById('answers');
    box.innerHTML = '';
    if (!answers.length) {
      var empty = document.createElement('div');
      empty.className = 'msg sys';
      empty.textContent = '用下方按钮开始：截图答题 / 立即回答';
      box.appendChild(empty);
    }
    answers.forEach(function (a) {
      var wrap = document.createElement('div');
      wrap.className = 'msg ai';
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = a.kind === 'exam' ? 'AI 答题' : 'AI 回答';
      wrap.appendChild(tag);

      var body = document.createElement('div');
      var badge = a.kind === 'exam' && a.text ? badgeOf(a.text) : null;
      if (badge) {
        body.className = 'badge';
        var letter = document.createElement('span');
        letter.className = 'letter';
        letter.textContent = badge.letter;
        body.appendChild(letter);
        if (badge.option) {
          var option = document.createElement('span');
          option.className = 'option';
          option.textContent = badge.option;
          body.appendChild(option);
        }
      } else {
        body.innerHTML = a.text ? renderBody(a.text) : (a.done ? '（空）' : '…');
      }
      wrap.appendChild(body);

      if (!a.done) {
        var cursor = document.createElement('span');
        cursor.className = 'typing';
        cursor.textContent = ' ▌';
        wrap.appendChild(cursor);
      }
      if (a.error) {
        var err = document.createElement('div');
        err.className = 'err';
        err.textContent = '出错：' + a.error;
        wrap.appendChild(err);
      }
      box.appendChild(wrap);
    });

    if (nearBottom) {
      requestAnimationFrame(function () { main.scrollTop = main.scrollHeight; });
    }
  }

  async function poll() {
    try {
      var res = await api('/api/state', { cache: 'no-store' });
      if (res.status === 403) {
        document.getElementById('net').className = 'dot bad';
        document.getElementById('statusText').textContent = '会话已失效，请重新扫码';
        return;
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var state = await res.json();
      document.getElementById('net').className = 'dot ok';
      render(state);
    } catch (e) {
      document.getElementById('net').className = 'dot bad';
      document.getElementById('statusText').textContent = '连接中断';
    }
  }

  document.getElementById('shotBtn').addEventListener('click', async function () {
    this.disabled = true;
    toast('已发送截图指令');
    try { await post('/api/screenshot'); } catch (e) { toast('发送失败'); }
    setTimeout(function () { document.getElementById('shotBtn').disabled = false; }, 1200);
  });

  document.getElementById('addShotBtn').addEventListener('click', async function () {
    this.disabled = true;
    try { await post('/api/shot/add'); toast('已截一张，可继续追加'); } catch (e) { toast('截图失败'); }
    setTimeout(function () { document.getElementById('addShotBtn').disabled = false; }, 900);
  });

  document.getElementById('submitShotsBtn').addEventListener('click', async function () {
    if (this.disabled) return;
    this.disabled = true;
    try { await post('/api/shot/submit'); toast('已提交，正在答题'); } catch (e) { toast('提交失败'); }
  });

  document.getElementById('answerBtn').addEventListener('click', async function () {
    this.disabled = true;
    toast('正在生成回答');
    try { await post('/api/answer'); } catch (e) { toast('发送失败'); }
    setTimeout(function () { document.getElementById('answerBtn').disabled = false; }, 1200);
  });

  document.getElementById('listenBtn').addEventListener('click', async function () {
    var on = this.textContent === '开始监听';
    this.disabled = true;
    try {
      await post('/api/listen', { on: on });
      toast(on ? '已开始监听' : '已停止监听');
    } catch (e) { toast('操作失败'); }
    setTimeout(function () { document.getElementById('listenBtn').disabled = false; }, 800);
  });

  document.getElementById('autoChk').addEventListener('change', async function () {
    var on = this.checked;
    autoLockUntil = Date.now() + 1500;
    try {
      await post('/api/auto', { on: on });
      toast(on ? '自动回答已开启' : '自动回答已关闭');
    } catch (e) { toast('操作失败'); }
  });

  document.getElementById('clearBtn').addEventListener('click', async function () {
    try {
      await post('/api/clear');
      lastSig = '';
      toast('已清空');
    } catch (e) { toast('操作失败'); }
  });

  poll();
  setInterval(poll, 700);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
</script>
</body>
</html>
